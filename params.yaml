blurb:
  # Polish the templated blurb with Gemini (requires GEMINI_API_KEY). Falls back to the
  # template blurb automatically if disabled, the key is missing, or the API call fails.
  use_llm: true
  tone: sassy
  gemini_model: gemini-3.6-flash 
  # how many top feature contributors to surface in the blurb
  top_contributors: 10

strava:
  # how many days of activity history to pull from Strava on each run
  days_back: 365

model:
  # nonzero-effort/distance quantile above which a day counts as "hard"/"long" for streak features
  hard_effort_quantile: 0.6
  long_ride_quantile: 0.75
  # number of recent calendar days held out for validation
  validation_period_days: 1095
  # exponential recency-weighting half-life (days): downweights old rows so training tracks current habits
  recency_half_life_days: 180
  xgboost:
    eta: 0.005477444762659259
    max_depth: 4
    subsample: 0.5129768272115813
    colsample_bytree: 0.9818997151469016
    n_estimators: 600
    random_state: 42
    min_child_weight: 4
    reg_lambda: 0.1

  features:
    - acute_load_7
    - chronic_load_28
    - month_train_rate
    - trained_days_30
    - mileage_chronic_28
    - trained_days_7
    - forecast_temp_high
    - dow_train_rate
    - days_since_last_hard
    - forecast_temp_low_vs_seasonal
    - forecast_precip_evening
    - forecast_precip_probability
    - forecast_temp_high_vs_seasonal
    - streak_length
    - days_since_last_long_ride
    - trained_days_2